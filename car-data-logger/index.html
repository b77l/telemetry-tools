<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>Telemetry Instruments · Flight V5</title>
<style>
:root{color-scheme:dark;--bg:#07111e;--panel:#101d2e;--panel2:#17263a;--line:#2a3c54;--fg:#e8f0fb;--muted:#91a5bd;--cyan:#57c7ef;--green:#6bd6a3;--amber:#f3bd65;--red:#ff747d;--blue:#4c9cff}
:root.light{color-scheme:light;--bg:#edf2f7;--panel:#fff;--panel2:#f1f5fa;--line:#d3deea;--fg:#18283c;--muted:#64758b;--cyan:#087fae;--green:#16865b;--amber:#a86a09;--red:#c63843;--blue:#176dcc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit}button,select,input{color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}button{font-weight:650;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--cyan);color:#03121d;border-color:transparent}.danger{border-color:#87434b;color:var(--red)}
header,main,footer{max-width:1050px;margin:auto;padding-left:14px;padding-right:14px}header{padding-top:17px;padding-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:1.25rem;letter-spacing:-.03em}.sub{color:var(--muted);font-size:.78rem}.top-actions,.toolbar,.tabs,.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tabs{padding:4px;background:var(--panel);border:1px solid 
var(--line);border-radius:12px;margin-bottom:12px}.tabs button{flex:1;background:transparent;border:0;color:var(--muted);padding:11px}.tabs button.active{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}main{padding-bottom:30px}.view{display:none}.view.active{display:block}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}.panel h2{font-size:.92rem;margin:0 0 
10px}.muted{color:var(--muted)}.tiny{font-size:.72rem;color:var(--muted)}.status{margin-left:auto;color:var(--muted);font-size:.78rem}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#74849a;margin-right:5px}.dot.on{background:var(--green)}.toolbar{margin-bottom:8px}.toolbar button{padding:8px 10px}.readouts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.readout{background:var(--panel2);border:1px solid 
var(--line);border-radius:11px;padding:10px;min-width:0}.readout label{display:block;color:var(--muted);font-size:.7rem}.num{font-size:clamp(1.25rem,4vw,1.85rem);font-weight:760;letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}.unit{font-size:.72rem;color:var(--muted);margin-left:3px}.cyan{color:var(--cyan)}.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.instrument{back
ground:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0}.instrument-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px}.instrument-head b{font-size:.82rem}.instrument .big{font-size:1.5rem;font-weight:750;font-variant-numeric:tabular-nums}.instrument canvas{display:block;width:100%;height:76px}.gauge canvas{height:120px}.pfd-wrap{background:#050a12;border:1px solid 
#29384b;border-radius:14px;padding:8px;overflow:hidden}.pfd-top{display:flex;justify-content:space-between;align-items:center;color:#7bd78d;font:700 .72rem ui-monospace,monospace;padding:0 5px 6px}.pfd{display:block;width:100%;height:auto;aspect-ratio:1.36;background:#05080e;border-radius:8px}.pfd-bottom{display:flex;justify-content:space-between;gap:8px;color:#a8c1dc;font:700 .72rem ui-monospace,monospace;padding:7px 4px 
1px}.pfd-readouts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.pfd-readouts .readout{padding:8px}.pfd-readouts .num{font-size:1.1rem}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 2px 9px}.section-title h2{font-size:1rem;margin:0}.section-title span{font-size:.72rem;color:var(--muted)}.settings{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.settings 
label{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center}.settings input{width:90px;padding:7px}.message{min-height:1.2em;color:var(--muted);font-size:.78rem;margin-top:7px}.message.error{color:var(--red)}.event-list{font-size:.76rem;color:var(--muted);max-height:110px;overflow:auto}.scroll-note{text-align:center;color:var(--muted);font-size:.72rem;padding:8px}footer{color:var(--muted);font-size:.72rem;padding-bottom:24px}.hidden{display:none!important}
@media(max-width:600px){header{padding-top:12px}.readouts{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.pfd-readouts{grid-template-columns:repeat(2,1fr)}.status{width:100%;margin-left:0}.tabs button{font-size:.85rem}}

/* Dedicated FLIGHT build: one mode, no mode switcher. */
#carView{display:none!important}
.tabs{display:none!important}
.sticky-logbar{position:fixed;z-index:50;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.sticky-logbar-inner{max-width:1050px;margin:auto;display:flex;align-items:center;gap:8px}
.sticky-logbar button{flex:1;min-width:0;padding:10px 8px}
.sticky-state{font-size:.68rem;font-weight:750;letter-spacing:.05em;color:var(--muted);min-width:92px}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
@media(max-width:600px){.sticky-logbar-inner{gap:5px}.sticky-logbar button{font-size:.78rem;padding:10px 5px}.sticky-state{min-width:68px;font-size:.58rem}body{padding-bottom:82px}}
</style>
</head>
<body>
<header><div><div class="brand">TELEMETRY <span style="color:var(--cyan)">/</span> FLIGHT</div><div class="sub">Flight instrumentation · GPS / attitude / G history</div></div><div class="top-actions"><button id="themeBtn" aria-label="Toggle theme">☼ / ☾</button></div></header>
